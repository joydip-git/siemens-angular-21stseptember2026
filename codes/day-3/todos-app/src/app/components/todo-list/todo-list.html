@if(!isRequestOver()){
<span>Loading...</span>
}@else if(errorInfo()!==''){
<span>{{errorInfo()}}</span>
}@else if(todos().length===0){
<span>No records</span>
}@else {
<h2>Todo List</h2>
<br>
<ul>
    @for (todo of todos(); track $index) {
    <!-- <li (click)="selectedTodo.set(todo)"> -->
    <li (click)="selectedTodoId.set(todo.id)">
        <u>{{todo.title}}</u>
        &nbsp;
        <button type="button">Delete</button>
    </li>
    }
</ul>
}

} -->

@if(selectedTodoId()>0){
