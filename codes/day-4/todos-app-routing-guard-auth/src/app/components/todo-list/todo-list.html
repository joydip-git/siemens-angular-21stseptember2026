@if(!isRequestOver()){
<span>Loading...</span>
}@else if(errorInfo()!==''){
<span>{{errorInfo()}}</span>
}@else if(todos().length===0){
<span>No records</span>
}@else {
<h2>Todo List</h2>
<br>
<ul>
    @for (todo of todos(); track $index) {
    <!-- <li (click)="gotoInfo(todo.id)"> -->
    <li [routerLink]="['/todos','view',todo.id]">
        <u>{{todo.title}}</u>
    </li>
    }
</ul>
}
